name: Nightly

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: nightly demo and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run janus demo
