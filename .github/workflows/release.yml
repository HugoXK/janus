name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v3
      - run: python3 scripts/release.py --root .
      - run: uv build
      - run: npm ci && npm pack --pack-destination ../dist
        working-directory: dsh-plugin
      - run: docker build -t janus:${{ github.ref_name }} .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
