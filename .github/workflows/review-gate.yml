name: Review gate

on:
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: review-gate
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v7
        if: hashFiles('base/.github/scripts/review_gate.py') == ''
        with:
          path: pr
          persist-credentials: false
      - name: Require reviewer approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEWER_LOGIN: HugoXK-bot
        run: |
          dir="base"
          if [ ! -f base/.github/scripts/review_gate.py ]; then
            dir="pr"
          fi
          python3 "$dir/.github/scripts/review_gate.py"
