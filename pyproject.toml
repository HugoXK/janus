[project]
name = "janus-market"
version = "0.1.0"
description = "Janus — a market agent with memory and foresight: look back to reason forward."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ke (Hugo) Xu" }]
keywords = ["agent", "market", "memory", "forecasting", "calibration", "dsh"]
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.5",
  "mypy>=1.10",
]
mcp = [
  "mcp>=1.0",
]

[project.scripts]
janus = "janus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/janus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E402", "I001", "B008", "B905"]

[tool.pytest.ini_options]
pythonpath = ["core"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
mypy_path = "core"
warn_unused_ignores = true
